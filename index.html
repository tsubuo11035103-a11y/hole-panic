<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ホールパニック</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">ふかふかマットであそぼう</p>
        <h1>ホールパニック</h1>
      </div>
      <button id="soundButton" class="icon-button" type="button" aria-label="音のオンオフ">🔊</button>
    </header>

    <main>
      <section id="homeScreen" class="screen active">
        <div class="hero-card">
          <div class="sample-hole"></div>
          <h2>穴を動かして<br />キャラをぜんぶ回収！</h2>
          <p>金色はフィーバー。ブラックは穴が小さくなるよ。</p>
        </div>

        <div class="unlock-card">
          <div class="unlock-title">有料版</div>
          <p>合言葉で高難易度ステージと画像アップロードを解放できます。</p>
          <div class="unlock-row">
            <input id="licenseInput" type="password" placeholder="合言葉" autocomplete="off" />
            <button id="unlockButton" type="button">解放</button>
          </div>
          <p id="unlockMessage" class="message"></p>
        </div>

        <div id="uploadPanel" class="upload-card locked-panel">
          <div>
            <strong>画像アップロード</strong>
            <p>PNG透過推奨。透過なしは四角い画像で表示されます。</p>
          </div>
          <input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp" />
          <button id="resetImageButton" type="button">標準画像にもどす</button>
        </div>

        <h2 class="section-title">ステージ</h2>
        <div id="stageList" class="stage-list"></div>
      </section>

      <section id="introScreen" class="screen">
        <div class="intro-card">
          <p id="introStageNo" class="eyebrow"></p>
          <h2 id="introTitle"></h2>
          <p id="introDescription"></p>
          <button id="startButton" class="primary-button" type="button">よーい…どん！</button>
          <button id="backFromIntroButton" class="ghost-button" type="button">ステージ選択へ</button>
        </div>
      </section>

      <section id="gameScreen" class="screen game-screen">
        <div class="hud">
          <div><span>TIME</span><strong id="timeLeft">0</strong></div>
          <div><span>GET</span><strong id="collectedText">0/0</strong></div>
          <div><span>LEVEL</span><strong id="holeLevelText">1</strong></div>
        </div>
        <div id="statusBanner" class="status-banner"></div>
        <div id="gameViewport" class="game-viewport">
          <div id="field" class="field"></div>
        </div>
      </section>

      <section id="resultScreen" class="screen">
        <div class="result-card">
          <p class="eyebrow">RESULT</p>
          <h2 id="resultTitle"></h2>
          <div id="rankBadge" class="rank-badge">A</div>
          <p id="rankName" class="rank-name"></p>
          <p id="rankComment" class="rank-comment"></p>
          <p id="resultTime" class="result-time"></p>
          <button id="retryButton" class="primary-button" type="button">もういちど</button>
          <button id="homeButton" class="ghost-button" type="button">ステージ選択へ</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
